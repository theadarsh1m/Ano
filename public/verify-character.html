<!DOCTYPE html>
<html>
<head>
  <title>Character Transform Verifier</title>
  <style>body { margin: 0; background: #111; } canvas { width: 100vw; height: 100vh; display: block; }</style>
</head>
<body>
<script type="importmap">
{
  "imports": {
    "three": "/node_modules/three/build/three.module.js",
    "three/addons/": "/node_modules/three/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111111);

// Match the exact ChamberClash3D camera
const camera = new THREE.PerspectiveCamera(78.5, window.innerWidth / window.innerHeight, 0.1, 50);
camera.position.set(0, 1.3, 1.2);
camera.lookAt(0, 0.77, -0.4);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// Lights
const ambient = new THREE.AmbientLight(0xffffff, 1.5);
scene.add(ambient);
const hemi = new THREE.HemisphereLight(0xffffff, 0x333333, 1.0);
scene.add(hemi);
const spot = new THREE.SpotLight(0xffe5bf, 100, 0, Math.PI/3, 0.5);
spot.position.set(0, 2.4, 0);
scene.add(spot);

// Table reference plane at Y=0.77
const tablePlane = new THREE.Mesh(
  new THREE.PlaneGeometry(2, 2),
  new THREE.MeshBasicMaterial({ color: 0x8B6914, side: THREE.DoubleSide, transparent: true, opacity: 0.5 })
);
tablePlane.rotation.x = -Math.PI/2;
tablePlane.position.y = 0.77;
scene.add(tablePlane);

// Grid helper
const grid = new THREE.GridHelper(4, 20, 0x444444, 0x222222);
scene.add(grid);

// Axis helper
const axes = new THREE.AxesHelper(1);
scene.add(axes);

const loader = new GLTFLoader();

// Load character
loader.load('/chamber-clash/3d/character-upper.glb', (gltf) => {
  const c = gltf.scene;
  
  // Log raw bounds
  const rawBox = new THREE.Box3().setFromObject(c);
  const rawCenter = new THREE.Vector3();
  const rawSize = new THREE.Vector3();
  rawBox.getCenter(rawCenter);
  rawBox.getSize(rawSize);
  console.log('RAW character bounds:', {
    min: rawBox.min.toArray().map(v=>v.toFixed(4)),
    max: rawBox.max.toArray().map(v=>v.toFixed(4)),
    center: rawCenter.toArray().map(v=>v.toFixed(4)),
    size: rawSize.toArray().map(v=>v.toFixed(4))
  });
  
  // Apply the EXACT centering logic from ChamberClash3D.tsx
  const box = new THREE.Box3().setFromObject(c);
  const center = new THREE.Vector3();
  box.getCenter(center);
  const size = new THREE.Vector3();
  box.getSize(size);
  
  c.position.set(-center.x, -center.y, -center.z);
  
  const groupY = 0.77 - size.y * 0.20;
  
  const group = new THREE.Group();
  group.position.set(0, groupY, -0.55);
  group.scale.set(1, 1, 1);
  group.add(c);
  scene.add(group);
  
  // Log final world bounds
  group.updateMatrixWorld(true);
  const finalBox = new THREE.Box3().setFromObject(group);
  const finalCenter = new THREE.Vector3();
  const finalSize = new THREE.Vector3();
  finalBox.getCenter(finalCenter);
  finalBox.getSize(finalSize);
  console.log('FINAL character world bounds:', {
    min: finalBox.min.toArray().map(v=>v.toFixed(4)),
    max: finalBox.max.toArray().map(v=>v.toFixed(4)),
    center: finalCenter.toArray().map(v=>v.toFixed(4)),
    size: finalSize.toArray().map(v=>v.toFixed(4))
  });
  console.log(`groupY = ${groupY.toFixed(4)}`);
  console.log(`Character top Y = ${finalBox.max.y.toFixed(4)}, table Y = 0.77`);
  console.log(`Visible above table = ${(finalBox.max.y - 0.77).toFixed(4)}m`);
  
  // Add bounding box helper
  const boxHelper = new THREE.Box3Helper(finalBox, 0x00ff00);
  scene.add(boxHelper);
  
  // Add info overlay
  const info = document.createElement('div');
  info.style.cssText = 'position:fixed;top:10px;left:10px;color:#0f0;font:14px monospace;background:rgba(0,0,0,0.8);padding:10px;white-space:pre';
  info.textContent = `Character GLB Transform Verifier
─────────────────────────────────
Raw center: [${rawCenter.toArray().map(v=>v.toFixed(3)).join(', ')}]
Raw size:   [${rawSize.toArray().map(v=>v.toFixed(3)).join(', ')}]
groupY:     ${groupY.toFixed(3)}
Final center: [${finalCenter.toArray().map(v=>v.toFixed(3)).join(', ')}]
Final size:   [${finalSize.toArray().map(v=>v.toFixed(3)).join(', ')}]
Head top Y:   ${finalBox.max.y.toFixed(3)} (table=0.77)
Visible above table: ${(finalBox.max.y - 0.77).toFixed(3)}m
Z range:      [${finalBox.min.z.toFixed(3)}, ${finalBox.max.z.toFixed(3)}]`;
  document.body.appendChild(info);
  
  renderer.render(scene, camera);
});

function animate() {
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
